name: Verify prototype

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild deterministic demo artifacts
        run: python scripts/build_all.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run browser-engine tests
        run: node --test tests/web-engine.test.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check docs/risk-engine.js
          node --check docs/app.js
          node --check docs/round2.js
      - name: Audit public artifacts and safety boundaries
        run: python scripts/audit_repository.py
      - name: Verify generated artifacts are committed
        if: matrix.python-version == '3.12'
        run: git diff --exit-code -- data docs/data outputs
