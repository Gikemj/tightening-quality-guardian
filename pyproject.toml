[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torque-guard"
version = "0.1.0"
description = "Reproducible prototype for proactive equipment-quality risk management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TorqueGuard contributors"}]
keywords = ["manufacturing", "quality", "SPC", "knowledge-graph", "agent"]
dependencies = []

[project.scripts]
torque-guard = "torque_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
